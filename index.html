<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8e7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="星星小學">
<title>星星小學打卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE everyday, for a 2nd grader: warm, bright, playful
   IDEA a picture-book school she builds herself, star by star
   PICTURE the campus map: buildings that grow and kids that walk around
   COLOUR cream ground, grass green, sunny star yellow, coral accent
   TYPE Zen Maru Gothic, rounded and friendly
   LAYOUT bottom tabs; today = big habit cards; campus = wide map that scrolls sideways */
:root{--bg:#fff8e7;--ink:#2d2a26;--muted:#6b645b;--line:#eadfcb;--card:#fff;--star:#ffbe1a;--coral:#ff7a59;--green:#7cc65a;--blue:#3d9bf0;color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Zen Maru Gothic","PingFang TC","Noto Sans TC",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));border-bottom:2px solid var(--line);background:var(--bg)}
h1{font-size:24px;margin:0;font-weight:900}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--star);border-radius:99px;padding:2px 14px;font-weight:900;font-size:20px;white-space:nowrap}
.pill .st,.st{color:var(--star)}
.pill.sm{font-size:16px;padding:1px 10px;border-width:2px}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;display:none;padding:16px max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
.view.on{display:block}
#campus.on{display:flex;flex-direction:column;padding:0;overflow:hidden}
.inner{max-width:760px;margin:0 auto}
nav.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{border:0;background:none;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted)}
nav.tabs button span{font-size:24px;line-height:1.1;filter:grayscale(.7);opacity:.7}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on span{filter:none;opacity:1;transform:scale(1.12)}
.btn{border:0;border-radius:16px;background:var(--coral);color:#fff;font-weight:900;padding:10px 18px;min-height:44px;box-shadow:0 3px 0 #d9573a}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #d9573a}
.btn:disabled{background:#d8d0c3;box-shadow:0 3px 0 #bfb5a5;color:#fff}
.ghostbtn{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
/* today */
.hello{display:flex;align-items:center;gap:16px;background:#fff;border:2px solid var(--line);border-radius:26px;padding:14px 18px}
.hello h2{margin:0;font-size:26px;font-weight:900;line-height:1.2}
.hello p{margin:2px 0 0;color:var(--muted)}
.ring{flex:none;width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:900}
.slot{font-size:18px;font-weight:900;margin:22px 4px 10px;display:flex;align-items:center;gap:8px}
.slot small{font-size:13px;color:var(--coral);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.hcard{position:relative;min-height:128px;border-radius:24px;border:3px solid var(--line);background:#fff;display:grid;align-content:center;justify-items:center;gap:2px;padding:12px;box-shadow:0 4px 0 var(--line);transition:transform .12s}
.hcard:active{transform:scale(.96)}
.hcard .ic{font-size:42px;line-height:1.1}
.hcard .t{font-weight:900;font-size:18px;text-align:center}
.hcard .s{font-size:13px;color:var(--muted);white-space:nowrap}
.hcard.done{background:#eef9e6;border-color:var(--green);box-shadow:0 4px 0 #5fa944}
.hcard.done .s{color:#2f7d32;font-weight:900;font-size:15px}
.hcard .ck{position:absolute;top:10px;right:12px;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;display:none;place-items:center;font-weight:900}
.hcard.done .ck{display:grid}
.fly{position:fixed;z-index:9000;font-weight:900;font-size:24px;color:var(--star);pointer-events:none;animation:fly .9s ease-out forwards;text-shadow:0 2px 0 #fff}
@keyframes fly{to{transform:translateY(-90px) scale(1.4);opacity:0}}
.hint{color:var(--muted);font-size:13px;margin-top:18px;text-align:center}
/* campus */
.cbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));background:#fff;border-bottom:2px solid var(--line);font-weight:700;font-size:14px;flex-wrap:wrap}
.cbar b{font-size:17px}
.hint0{position:absolute;left:260px;top:200px;max-width:340px;background:#fff;border:3px solid var(--star);border-radius:22px;padding:14px 18px;font-weight:900;font-size:17px;z-index:100;box-shadow:0 4px 0 #e8c25a}
.devs{display:flex;gap:6px;flex-wrap:wrap}
.bell{display:inline-block;background:#ffe9a8;border-radius:99px;padding:2px 10px;margin-right:8px;font-size:13px;font-weight:900}
.bell.off{background:#eef6e6}
.danger{background:#e5484d;box-shadow:0 3px 0 #b8363a}
.ghostbtn.danger{background:#fff;color:#d93a40;border-color:#f3c0c1;box-shadow:0 3px 0 #f3c0c1}
.bld.gone{animation:gone .7s ease-in forwards;transform-origin:50% 100%}
@keyframes gone{to{transform:scale(.2);opacity:0}}
#map.lunch .bld[data-type=classroom]::after,#map.inclass .bld[data-type=classroom]::after{position:absolute;left:50%;top:-62px;transform:translateX(-50%);background:#fff;border:2px solid var(--line);border-radius:99px;padding:1px 10px;font-size:14px;font-weight:900;white-space:nowrap;animation:bob 1.4s ease-in-out infinite alternate}
#map.lunch .bld[data-type=classroom]::after{content:"🍱 午餐・💤 午睡"}
#map.inclass .bld[data-type=classroom]::after{content:"✏️ 上課中"}
@keyframes bob{to{margin-top:-5px}}
.mini{border:2px dashed var(--line);background:#fff;border-radius:12px;padding:4px 10px;font-size:13px;color:var(--muted);min-height:34px}
.mapwrap{flex:1;min-height:0;overflow:auto;background:#e9dcc3;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.mapin{position:relative;width:1504px;height:724px}
.zoomctl{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:18px;z-index:20;display:flex;align-items:center;background:#fff;border:2px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--line)}
.zoomctl button{border:0;background:none;width:46px;height:46px;font-size:24px;font-weight:900}
.zoomctl span{min-width:52px;text-align:center;font-weight:900;font-size:14px}
.placebar.on~.zoomctl{display:none}
#map{position:absolute;left:32px;top:64px;transform-origin:0 0;width:1440px;height:540px;border-radius:26px;background:radial-gradient(circle at 30% 30%,#a3dd7d 0 2px,transparent 3px) 0 0/34px 34px,radial-gradient(circle at 70% 70%,#84c862 0 2px,transparent 3px) 0 0/46px 46px,#8fd16a;box-shadow:0 0 0 8px #d8b483,0 0 0 13px #b98d55}
#map.gridon::before{content:"";position:absolute;inset:0;border-radius:26px;background-image:linear-gradient(rgba(255,255,255,.4) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.4) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.bld{position:absolute;cursor:pointer}
.bld svg{position:absolute;left:0;top:-50px;overflow:visible;pointer-events:none;transform-origin:50% 100%}
.bld.pop svg{animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.55)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.scaf{position:absolute;inset:-8px -6px -4px;border-radius:12px;background:repeating-linear-gradient(45deg,rgba(255,200,40,.75) 0 10px,rgba(70,70,70,.55) 10px 20px);display:grid;place-items:center;animation:shake .14s infinite}
.ham{font-size:30px;animation:ham .28s infinite alternate;transform-origin:80% 80%}
@keyframes shake{50%{transform:translateX(1.5px)}}
@keyframes ham{to{transform:rotate(-35deg)}}
.dust{position:absolute;width:16px;height:16px;border-radius:50%;background:#efe3cc;z-index:4500;pointer-events:none;animation:puff .8s ease-out forwards}
@keyframes puff{to{transform:translate(var(--dx),-26px) scale(2.2);opacity:0}}
.conf{position:absolute;width:8px;height:12px;border-radius:2px;z-index:7000;pointer-events:none;animation:conf 1.2s ease-out forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(560deg);opacity:0}}
.ghost{position:absolute;pointer-events:none;border-radius:10px;outline:3px dashed #fff;outline-offset:-2px;background:rgba(90,220,120,.35);opacity:.85}
.ghost.bad{background:rgba(255,80,80,.45)}
.ghost svg{position:absolute;left:0;top:-50px;overflow:visible;opacity:.75}
.npc{position:absolute;left:0;top:0;cursor:pointer;will-change:transform;transition:opacity .4s}
.npc .bob{width:100%;height:100%}
.npc .fig{display:block;transform-origin:50% 100%}
.npc.flip .fig{transform:scaleX(-1)}
.npc.walk .l1,.npc.walk .l2{transform-box:fill-box;animation:leg .32s infinite alternate}
.npc.walk .l2{animation-direction:alternate-reverse}
@keyframes leg{to{transform:translateY(-2.5px)}}
.npc.jump .bob{animation:jump .5s infinite}
.npc.bounce .bob{animation:jump .7s infinite}
.npc.dig .bob{animation:dig .4s infinite alternate}
@keyframes jump{50%{transform:translateY(-9px)}}
@keyframes dig{to{transform:translateY(3px) rotate(6deg)}}
.npc .ic{position:absolute;left:50%;top:-20px;transform:translateX(-50%);font-size:17px;line-height:1}
.npc .say{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px 10px;font-size:14px;font-weight:700;white-space:nowrap}
.flutter{transform-box:fill-box;animation:flut 2.2s ease-in-out infinite}
@keyframes flut{50%{transform:translate(5px,-7px)}}
.wave{transform-box:fill-box;transform-origin:0 50%;animation:wave 1.1s ease-in-out infinite alternate}
@keyframes wave{to{transform:skewY(-10deg) scaleX(.88)}}
.swing{transform-box:fill-box;transform-origin:50% 0;animation:sw 1.6s ease-in-out infinite alternate}
.sw2{animation-delay:-.8s}
@keyframes sw{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.fab{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:18px;z-index:20;border:0;border-radius:22px;background:var(--coral);color:#fff;font-weight:900;font-size:20px;padding:14px 22px;box-shadow:0 5px 0 #d9573a}
.placebar{position:absolute;left:12px;right:12px;bottom:14px;z-index:20;display:none;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:20px;padding:10px 12px;box-shadow:0 4px 0 var(--line)}
.placebar.on{display:flex}
.placebar span{flex:1;font-weight:700;font-size:14px}
/* sheet */
.back{position:fixed;inset:0;background:rgba(45,42,38,.35);z-index:8000;display:none}
.back.on{display:block}
.sheet{position:fixed;left:50%;bottom:0;width:min(100%,600px);max-height:82%;overflow-y:auto;background:#fff;border-radius:28px 28px 0 0;padding:18px max(18px,env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom));z-index:8001;transform:translate(-50%,105%);transition:transform .25s}
.sheet.on{transform:translate(-50%,0)}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh-h h2{margin:0;font-size:24px;font-weight:900}
.segs{display:flex;gap:8px;margin:14px 0;overflow-x:auto}
.seg{flex:none;border:2px solid var(--line);background:#fff;border-radius:99px;padding:6px 16px;font-weight:900;min-height:40px}
.seg.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{border:3px solid var(--line);background:#fffdf7;border-radius:20px;padding:10px 8px;display:grid;justify-items:center;gap:2px}
.item.lack{opacity:.55}
.item b{font-size:17px}
.item .cost{font-weight:900;color:#c98a00}
.item small{color:var(--muted);font-size:13px}
.pv{width:96px;height:84px;display:block}
.pv svg{width:100%;height:100%}
.pv.big{width:100%;height:150px;background:#eaf6df;border-radius:18px;padding:8px}
.lvs .lv{color:#e3dccf;font-size:22px}
.lvs .lv.on{color:var(--star)}
.note{color:var(--muted);margin:10px 0}
.upg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px;align-items:center;background:#fff8e7;border-radius:20px;padding:12px;margin:10px 0}
.upg .pv.big{height:120px}
.upg .btn{margin-top:8px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-20px);background:var(--ink);color:#fff;font-weight:900;padding:10px 20px;border-radius:99px;z-index:9500;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}
.cel{position:fixed;inset:0;z-index:9200;background:rgba(255,248,231,.92);display:none;place-items:center;padding:24px}
.cel.on{display:grid}
.celbox{text-align:center;max-width:360px}
.celbox svg{width:160px;height:160px;animation:spin 2.5s ease-in-out infinite}
@keyframes spin{50%{transform:rotate(12deg) scale(1.08)}}
.celbox h2{font-size:32px;margin:8px 0;font-weight:900}
.celbox .row{justify-content:center}
/* week */
.wsum{display:flex;align-items:center;gap:16px;background:#fff;border:2px solid var(--line);border-radius:24px;padding:14px 18px;margin-bottom:16px}
.wsum .big{font-size:48px;font-weight:900;color:var(--coral);line-height:1}
.wsum small{color:var(--muted)}
.wgrid{background:#fff;border:2px solid var(--line);border-radius:24px;padding:10px}
.wrow{display:grid;grid-template-columns:minmax(88px,1.5fr) repeat(7,minmax(0,1fr));gap:4px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.wrow:last-child{border:0}
.wh div{text-align:center;font-weight:900;font-size:14px;line-height:1.2}
.wh small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.wh .today{color:var(--coral)}
.wn{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wc{height:46px;border-radius:12px;background:#f6f1e6;display:grid;place-items:center;align-content:center;line-height:1.1}
.wc.done{background:#fff1c2}
.wc.done b{color:var(--star);font-size:18px}
.wc small{font-size:11px;color:var(--muted);white-space:nowrap}
.wc.off{background:none;color:#cfc6b6}
.wc.fut{background:#fbf8f1}
/* rewards */
.bank{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--line);border-radius:24px;padding:14px 18px}
.bank .big{font-size:44px;font-weight:900;line-height:1}
.rws{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px}
.rw{background:#fff;border:3px solid var(--line);border-radius:22px;padding:14px;display:grid;gap:6px}
.rt{font-size:18px;font-weight:900}
.rc{font-weight:900;color:#c98a00}
.pend{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff8e7;border:2px dashed var(--star);border-radius:18px;padding:10px 12px;margin-top:10px;flex-wrap:wrap}
h3{font-size:18px;margin:24px 4px 6px}
.fine{color:var(--muted);font-size:13px;margin-top:22px}
/* parent */
.hr{display:flex;align-items:center;gap:8px}
.lockbtn{border:2px solid var(--line);background:#fff;border-radius:14px;width:44px;height:44px;font-size:18px}
.pshell{display:none;flex:1;min-height:0;flex-direction:column}
body.pmode .kid{display:none!important}
body.pmode .pshell{display:flex}
.pshell header.top{background:#f4f7fb;border-bottom-color:#dfe6ef}
.pshell main{flex:1;min-height:0;position:relative;background:#f4f7fb}
.pshell h1{font-size:22px}
.pcard{background:#fff;border:1.5px solid #dfe6ef;border-radius:18px;padding:14px 16px;margin-bottom:12px}
.pcard h3{margin:0 0 8px;font-size:17px}
.prow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eef2f6}
.prow:last-child{border:0}
.prow .ic{font-size:24px;width:32px;text-align:center}
.prow .grow{flex:1}
.prow small{color:var(--muted);display:block;font-size:13px}
.ok{color:#2f7d32;font-weight:900}
.no{color:#a39a8c}
.sbtn{border:1.5px solid #cfd8e3;background:#fff;border-radius:12px;padding:6px 12px;min-height:40px;font-weight:700;font-size:14px;white-space:nowrap}
.sbtn.pri{background:#3d6fd1;border-color:#3d6fd1;color:#fff}
.sbtn.red{color:#d93a40;border-color:#f3c0c1}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.datenav b{font-size:18px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1.5px solid #dfe6ef;border-radius:16px;padding:10px 12px}
.kpi b{display:block;font-size:24px;line-height:1.2}
.kpi small{color:var(--muted);font-size:13px}
textarea,.pin-in,input.tx,input[type=time],input[type=number],select{font:inherit;font-size:16px;border:1.5px solid #cfd8e3;border-radius:12px;padding:8px 10px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:76px;resize:vertical}
.field{margin:10px 0}
.field>span{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid #cfd8e3;background:#fff;border-radius:99px;padding:6px 12px;min-height:38px;font-weight:700}
.chip.on{background:#3d6fd1;color:#fff;border-color:#3d6fd1}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.icons button{font-size:22px;height:44px;border:1.5px solid #cfd8e3;background:#fff;border-radius:12px}
.icons button.on{border:3px solid #3d6fd1;background:#eaf1ff}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.cal .h{font-size:13px;color:var(--muted);font-weight:700}
.cal button{border:0;border-radius:12px;min-height:48px;background:#eef2f6;font-weight:700;padding:4px 0;line-height:1.1}
.cal button small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.cal button.today{outline:2px solid #3d6fd1}
.cal button:disabled{opacity:.35}
.bar{height:10px;border-radius:99px;background:#eef2f6;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:#7cc65a;border-radius:99px}
.tag{display:inline-block;font-size:12px;font-weight:900;border-radius:99px;padding:1px 8px;margin-left:6px}
.tag.best{background:#e5f6dc;color:#2f7d32}.tag.low{background:#fff1d6;color:#b26b00}
.sched{gap:6px}
.sched b{white-space:nowrap;font-size:14px;flex:none}
.sched input{flex:1;min-width:0;padding:6px 6px}
.sched .sbtn{padding:6px 10px}
.dchart{display:flex;align-items:flex-end;gap:2px;height:110px;background:#f7f9fc;border-radius:12px;padding:6px}
.dcol{flex:1;min-width:0;height:100%;border:0;background:none;padding:0;display:flex;align-items:flex-end}
.dcol i{display:block;width:100%;border-radius:4px 4px 0 0}
.dlab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.dlab2{display:grid;gap:2px;font-size:11px;color:var(--muted);text-align:center;margin-top:4px;padding:0 6px}
input[type=date]{font:inherit;font-size:16px;border:1.5px solid #cfd8e3;border-radius:12px;padding:6px;background:#fff;color:var(--ink);flex:1;min-width:0}

<script>
{
const CELL=60,COLS=24,ROWS=9,KEY='starSchool.v2';
const CAT={

  principal:{name:'校長室',cat:'教學',w:2,h:2,cost:[35,50,80],ppl:3},

  gate:{name:'校門',cat:'',w:2,h:1,cost:[0,20,40],ppl:0}
};
const CATS=['植物','育樂','運動','教學'];
const UPNOTE={2:'加上裝飾，看起來更漂亮',3:'變大一號，還會動起來'};
const SLOTS=['早上','放學後','睡前'];
const TITLES={today:'今天',campus:'我的校園',rewards:'獎勵',week:'這週'};
const SHIRTS=['#ff9e7a','#7ec8ff','#ffd23f','#9be07a','#c9a2ff','#ff8fb8','#5fd0c4'];
const TE=['今天也要開心學習喔！','記得多喝水～','你的校園越來越漂亮了！','上課囉，同學們！'];
const PR=['歡迎來到星星小學！','我們的學校越來越熱鬧了','謝謝你這麼用心蓋學校','校長最喜歡看大家玩了'];
const NU=['不舒服要來保健室喔','記得洗手！','跌倒了要小心喔','多喝水，身體棒棒'];
const CL=['垃圾要分類喔！','校園乾乾淨淨真舒服','寶特瓶放這邊','謝謝你幫忙撿垃圾'];
const GD=['同學注意安全喔！','早安！歡迎來上學','我會好好守護星星小學','放學要排隊喔'];
const DEF_SCHED={periods:[['08:40','09:20'],['09:30','10:10'],['10:30','11:10'],['11:20','12:00'],['13:40','14:20'],['14:30','15:10'],['15:20','16:00']],lunch:['12:00','13:20']};
const toMin=t=>{const a=t.split(':').map(Number);return a[0]*60+a[1]};
const tshow=t=>t.replace(/^0/,'');
const ST=['我們去打球！','下課了～','我最喜歡圖書館了','好想玩沙坑！','一起去溜滑梯！'];

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hm=iso=>{const d=new Date(iso);return d.getHours()+':'+pad(d.getMinutes())};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function seed(demo){
  const all=[0,1,2,3,4,5,6];
  const habits=[
    {id:'hw',title:'完成學校作業',icon:'📒',slot:'放學後',days:[1,2,3,4,5]},
    {id:'read',title:'閱讀',icon:'📚',slot:'睡前',days:all},
    {id:'desk',title:'整理書桌',icon:'🧹',slot:'睡前',days:all},
    {id:'sleep',title:'早睡',icon:'🌙',slot:'睡前',days:all}];
  const st={v:1,stars:0,habits,checkins:{},
    campus:{nextId:1,buildings:[{id:'g',type:'gate',level:1,c:1,r:8}]},
    rewards:[{id:'r1',title:'可愛貼紙一張',cost:10},{id:'r2',title:'週末多玩 20 分鐘',cost:25},{id:'r3',title:'新的彩色筆',cost:40}],
    redemptions:[],demo:!!demo};
  if(demo){
    st.stars=26;
    const base={hw:[17,5],read:[20,25],desk:[20,45],sleep:[21,10]};
    for(let i=1;i<=6;i++){
      const d=new Date();d.setDate(d.getDate()-i);const rec={};
      habits.forEach((h,j)=>{
        if(!h.days.includes(d.getDay())||(i+j)%4===0)return;
        const t=new Date(d);t.setHours(base[h.id][0],base[h.id][1]+((i*7+j*5)%25),0,0);
        rec[h.id]={at:t.toISOString(),by:'child'};
      });
      st.checkins[dkey(d)]=rec;
    }
  }
  return st;
}
function ensure(st){st.child=st.child||{name:'小星星'};st.pin=st.pin||'0000';st.notes=st.notes||{};st.reviews=st.reviews||{};st.starLog=st.starLog||[];st.schedule=st.schedule||JSON.parse(JSON.stringify(DEF_SCHED));st.maxPpl=st.maxPpl||30;if(st.bonusStars===undefined)st.bonusStars=10;st.bonusGiven=st.bonusGiven||{};st.habits.forEach(h=>{if(h.active===undefined)h.active=true;h.cat=h.cat||'學習'});return st}
function load(){try{const t=localStorage.getItem(KEY);if(t)return ensure(JSON.parse(t))}catch(e){}return ensure(seed(true))}
let S=load();
function logStar(d,text){const e={d,text:String(text),at:new Date().toISOString()};S.starLog.push(e);if(S.starLog.length>300)S.starLog.splice(0,S.starLog.length-300);if(CLOUD&&CLOUD.ready)F.addDoc(F.collection(CLOUD.ref,'logs'),{...e,by:CLOUD.user.uid}).catch(err=>console.warn(err))}
let CLOUD=null,F=null,base={},baseStars=0;
function save(){if(CLOUD&&CLOUD.ready){syncPush();return}try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const pendingCost=()=>S.redemptions.filter(r=>r.status==='pending').reduce((a,r)=>a+r.cost,0);
const avail=()=>Math.max(0,S.stars-pendingCost());
function renderStars(){document.querySelectorAll('[data-stars]').forEach(n=>n.textContent=avail())}
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}

/* ---------- today ---------- */
const curSlot=()=>{const h=new Date().getHours();return h<12?'早上':h<18?'放學後':'睡前'};
const actH=()=>S.habits.filter(h=>h.active!==false);
const todayHabits=()=>{const d=new Date().getDay();return actH().filter(h=>h.days.includes(d))};
function renderToday(){
  const rec=S.checkins[dkey(new Date())]||{},list=todayHabits(),done=list.filter(h=>rec[h.id]).length;
  const h=new Date().getHours(),greet=(h<11?'早安':h<17?'午安':'晚安')+'，'+esc(S.child.name)+'！';
  const pct=list.length?done/list.length:0,C=2*Math.PI*38;
  const now=curSlot(),order=[now,...SLOTS.filter(s=>s!==now)];
  let html=`<div class="inner"><div class="hello"><div class="ring"><svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="38" fill="none" stroke="#f1e8d6" stroke-width="12"/><circle cx="46" cy="46" r="38" fill="none" stroke="#7cc65a" stroke-width="12" stroke-linecap="round" opacity="${pct?1:0}" stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}"/></svg><b>${done}/${list.length}</b></div><div><h2>${greet}</h2><p>${done===list.length&&list.length?'今天的習慣都完成了，好棒！':'完成一個習慣，就得到一顆星星'}</p></div></div>`;
  order.forEach(s=>{
    const items=list.filter(x=>x.slot===s);if(!items.length)return;
    html+=`<div class="slot">${s}${s===now?'<small>現在</small>':''}</div><div class="cards">`+items.map(x=>{const r=rec[x.id];return `<button class="hcard ${r?'done':''}" data-h="${x.id}"><span class="ck">✓</span><span class="ic">${x.icon}</span><span class="t">${esc(x.title)}</span><span class="s">${r?hm(r.at)+' 完成':'點一下打卡'}</span></button>`}).join('')+'</div>';
  });
  html+=`<p class="hint">打錯了？再點一下就可以取消（只限今天）</p></div>`;
  $('#today').innerHTML=html;
}
$('#today').addEventListener('click',e=>{
  const b=e.target.closest('.hcard');if(!b)return;
  const id=b.dataset.h,k=dkey(new Date()),rec=S.checkins[k]||(S.checkins[k]={});
  const list=todayHabits(),wasAll=list.every(h=>rec[h.id]);
  if(rec[id]){delete rec[id];S.stars=Math.max(0,S.stars-1);logStar(-1,'取消打卡：'+(S.habits.find(h=>h.id===id)||{}).title)}
  else{rec[id]={at:new Date().toISOString(),by:'child'};S.stars++;logStar(1,'打卡：'+(S.habits.find(h=>h.id===id)||{}).title);const r=b.getBoundingClientRect();const f=document.createElement('div');f.className='fly';f.textContent='+1 ★';f.style.left=(r.left+r.width/2-30)+'px';f.style.top=(r.top+10)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),950)}
  save();renderToday();renderStars();
  const before=S.bonusGiven[dkey(weekOf(new Date())[0])];checkBonus(new Date(),false);
  if(!before&&S.bonusGiven[dkey(weekOf(new Date())[0])]){}else if(!wasAll&&list.every(h=>rec[h.id])){$('#celT').textContent='今天全部完成！';$('#celP').textContent='得到的星星可以去蓋校園喔';setTimeout(()=>$('#cel').classList.add('on'),400)}
});
$('#celx').onclick=()=>$('#cel').classList.remove('on');
$('#celgo').onclick=()=>{$('#cel').classList.remove('on');show('campus')};

/* ---------- drawings ---------- */
const sh=(W,H,k)=>`<ellipse cx="${W/2}" cy="${H-5}" rx="${W*(k||.42)}" ry="7" fill="#1b4d12" opacity=".18"/>`;
const flag=(x,y,col)=>`<path d="M${x} ${y}v34" stroke="#777" stroke-width="2.5"/><path class="wave" d="M${x+1} ${y}h18l-4 6 4 6h-18z" fill="${col}"/>`;
const PET=[0,72,144,216,288].map(a=>[Math.cos(a*Math.PI/180)*6,Math.sin(a*Math.PI/180)*6]);
const fl=(x,y,col,s)=>`<g transform="translate(${x} ${y}) scale(${s||1})"><path d="M0 0V14" stroke="#3f9a3a" stroke-width="3"/><ellipse cx="5" cy="9" rx="5" ry="2.5" fill="#4fae46"/>${PET.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.6" fill="${col}"/>`).join('')}<circle r="3.4" fill="#ffd23f"/></g>`;
const crowd=(x0,y0,cols,rows,gap)=>{const c=['#ff7a59','#3d9bf0','#ffd23f','#7cc65a','#b388ff'];let s='';for(let r=0;r<rows;r++)for(let i=0;i<cols;i++)s+=`<circle cx="${x0+i*gap+(r%2)*gap/2}" cy="${y0+r*13}" r="3.4" fill="${c[(i+r)%5]}"/>`;return s};
function handAngles(){const d=new Date(),m=d.getMinutes(),h=d.getHours()%12;return [h*30+m*.5,m*6]}
function clockHands(cx,cy,r){const a=handAngles();return `<g class="clk"><line class="hh" x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy-r*.5}" stroke="#2d2a26" stroke-width="3.2" stroke-linecap="round" transform="rotate(${a[0]} ${cx} ${cy})" data-c="${cx} ${cy}"/><line class="mh" x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy-r*.78}" stroke="#e8634f" stroke-width="2.2" stroke-linecap="round" transform="rotate(${a[1]} ${cx} ${cy})" data-c="${cx} ${cy}"/><circle cx="${cx}" cy="${cy}" r="1.6" fill="#2d2a26"/></g>`}
function updateClocks(){const a=handAngles();document.querySelectorAll('.clk .hh').forEach(l=>l.setAttribute('transform',`rotate(${a[0]} ${l.dataset.c})`));document.querySelectorAll('.clk .mh').forEach(l=>l.setAttribute('transform',`rotate(${a[1]} ${l.dataset.c})`))}
setInterval(updateClocks,15000);
function timeWords(){const d=new Date(),h=d.getHours(),m=d.getMinutes();return `現在是${h<12?'上午':h<18?'下午':'晚上'} ${h%12||12} 點${m?` ${m} 分`:'整'}`}
function sayTime(){const w=timeWords();toast(w);try{const u=new SpeechSynthesisUtterance(w);u.lang='zh-TW';u.rate=.9;const v=speechSynthesis.getVoices().find(x=>/zh[-_](TW|Hant)/i.test(x.lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const DRAW={

/* zoom: pinch, ctrl+wheel, buttons; double tap = back to 100% */
const PADL=32,PADT=64,PADR=32,PADB=120,ZMIN=.4,ZMAX=2.2;
let zoom=1,openT=null,pinch=null,tapStart=null,lastTap=0;
function applyZoom(z,cx,cy){
  z=Math.max(ZMIN,Math.min(ZMAX,z));const wr=wrap.getBoundingClientRect();
  const px=(cx===undefined?wr.left+wr.width/2:cx)-wr.left,py=(cy===undefined?wr.top+wr.height/2:cy)-wr.top;
  const mx=(wrap.scrollLeft+px-PADL)/zoom,my=(wrap.scrollTop+py-PADT)/zoom;
  zoom=z;mapEl.style.transform=`scale(${z})`;
  mapIn.style.width=(COLS*CELL*z+PADL+PADR)+'px';mapIn.style.height=(ROWS*CELL*z+PADT+PADB)+'px';
  wrap.scrollLeft=mx*z+PADL-px;wrap.scrollTop=my*z+PADT-py;
  const lv=document.getElementById('zlv');if(lv)lv.textContent=Math.round(z*100)+'%';
}
const tdist=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
wrap.addEventListener('touchstart',e=>{
  if(e.touches.length===2){pinch={d:tdist(e.touches[0],e.touches[1]),z:zoom};tapStart=null;clearTimeout(openT)}
  else if(e.touches.length===1)tapStart={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now()};
},{passive:true});
wrap.addEventListener('touchmove',e=>{
  if(pinch&&e.touches.length===2){e.preventDefault();const a=e.touches[0],b=e.touches[1];applyZoom(pinch.z*tdist(a,b)/pinch.d,(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2)}
},{passive:false});
wrap.addEventListener('touchend',e=>{
  if(pinch){if(e.touches.length<2)pinch=null;lastTap=0;return}
  if(!tapStart||e.touches.length)return;
  const t=e.changedTouches[0],moved=Math.hypot(t.clientX-tapStart.x,t.clientY-tapStart.y);
  if(moved<12&&Date.now()-tapStart.t<300){const now=Date.now();
    if(now-lastTap<320&&!mode){clearTimeout(openT);e.preventDefault();applyZoom(1,t.clientX,t.clientY);toast('回到原始大小');lastTap=0}
    else lastTap=now}
  tapStart=null;
});
wrap.addEventListener('dblclick',e=>{if(mode)return;clearTimeout(openT);if(zoom!==1){applyZoom(1,e.clientX,e.clientY);toast('回到原始大小')}});
wrap.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();applyZoom(zoom*Math.exp(-e.deltaY*.01),e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>applyZoom(zoom*1.25);
document.getElementById('zout').onclick=()=>applyZoom(zoom/1.25);

function gatePt(){const g=S.campus.buildings.find(b=>b.type==='gate');return {x:(g.c+1)*CELL,y:(g.r+1)*CELL-4}}

const STAFF=[['guardhouse','gd','警衛叔叔來上班了！'],['health','nurse','護理師阿姨來保健室上班了！'],['recycle','clean','清潔工伯伯來幫忙打掃了！']];
let staffN={};
const hasB=t=>S.campus.buildings.some(b=>b.type===t);
const crowdN=()=>npcs.filter(n=>!n.staff);
function spawn(p,announce){let n;if(announce){const g=gatePt();n=makeNPC(p,g.x+(Math.random()*20-10),g.y)}else n=makeNPC(p,40+Math.random()*(COLS*CELL-80),60+Math.random()*(ROWS*CELL-100));if(goesIn(n,phaseNow))sendToClass(n,npcs.length);return n}
function syncPeople(announce){
  const n=Math.min(S.maxPpl,population()),before=crowdN().length;
  while(crowdN().length<n)spawn(ROLES[crowdN().length],announce);
  while(crowdN().length>n){const x=crowdN().at(-1);x.el.remove();npcs.splice(npcs.indexOf(x),1)}
  STAFF.forEach(([bt,role,msg],k)=>{const x=staffN[role];
    if(!hasB(bt)&&x){x.el.remove();npcs.splice(npcs.indexOf(x),1);delete staffN[role]}
    else if(hasB(bt)&&!x){const y=spawn({role},announce);y.staff=true;staffN[role]=y;if(announce)setTimeout(()=>toast(msg),900+k*300)}
  });
  if(announce&&n>before){
    const got=ROLES.slice(before,n);
    if(got.some(p=>p.role==='pr'))setTimeout(()=>toast('校長來到星星小學了！'),900);
    else if(got.some(p=>p.role==='mt'))setTimeout(()=>toast('男老師來了！'),900);
    else setTimeout(()=>toast(`有 ${n-before} 位新同學來上學了！`),900);
  }
  renderCbar();
}
function renderCbar(){
  const pop=population(),n=Math.min(S.maxPpl,pop),t=(n>0?1:0)+(n>15?1:0),pr=n>=30?1:0,st=Object.keys(staffN).length;
  const per=periodNow(),f=x=>x[0]+':'+pad(x[1]),raw=curPhase();
  const status=phaseNow==='class'?`<span class="bell">上課中${per&&!forcePhase?` ${tshow(per[0])}–${tshow(per[1])}`:''}</span>`:phaseNow==='lunch'?`<span class="bell">午休時間 ${tshow(S.schedule.lunch[0])}–${tshow(S.schedule.lunch[1])}</span>`:raw!=='free'?`<span class="bell off">${raw==='class'?'上課':'午休'}時間（還沒有教室）</span>`:'<span class="bell off">下課時間</span>';
  $('#pop').innerHTML=`${status}<b>全校 ${pop+st} 人</b>　老師 ${t}・學生 ${n-t-pr}${pr?'・校長 1':''}${staffN.gd?'・警衛 1':''}${staffN.nurse?'・護理師 1':''}${staffN.clean?'・清潔工 1':''}${pop>S.maxPpl?`（學生老師畫面顯示 ${S.maxPpl} 人）`:''}`;
  if($('#clsbtn'))$('#clsbtn').textContent=({class:'測試：上課',lunch:'測試：午休',free:'測試：下課'})[forcePhase]||'時間：依時鐘';
}
function startHint(){let h=$('#hint0');const need=!S.campus.buildings.some(b=>CAT[b.type].ppl);if(need&&!h){h=document.createElement('div');h.id='hint0';h.className='hint0';h.textContent='按「＋ 建造」，在「教學」裡蓋第一間教室，老師和同學就會來上學喔！';mapEl.appendChild(h)}else if(!need&&h)h.remove()}
function renderCampus(){mapEl.querySelectorAll('.bld').forEach(x=>x.remove());S.campus.buildings.forEach(b=>mapEl.appendChild(bldEl(b)));syncPeople(false);startHint()}

const INSIDE=['classroom','library','office','principal','sportscenter','health','auditorium'];
const EXIT_ICON={library:'📖',sportscenter:'💪',health:'🩹',auditorium:'🎵'};
const ROLE_OK={office:['ft','mt'],principal:['pr'],guardhouse:['gd'],recycle:['clean']};
function pickTarget(n){
  const r=n.p.role;
  let bs=S.campus.buildings.filter(b=>b.type!=='gate'&&(!ROLE_OK[b.type]||ROLE_OK[b.type].includes(r)));
  if(r==='gd'){const g=S.campus.buildings.filter(b=>b.type==='guardhouse'||b.type==='gate');if(Math.random()<.75)bs=g}
  if(r==='nurse'&&Math.random()<.7)bs=S.campus.buildings.filter(b=>b.type==='health');
  if(r==='clean'&&hasB('recycle')&&Math.random()<.35)bs=S.campus.buildings.filter(b=>b.type==='recycle');
  if(r==='pr'&&hasB('principal')&&Math.random()<.4)bs=S.campus.buildings.filter(b=>b.type==='principal');
  if((r==='ft'||r==='mt')&&hasB('office')&&Math.random()<.35)bs=S.campus.buildings.filter(b=>b.type==='office');
  if(bs.length&&Math.random()<.7){
    const b=bs[Math.floor(Math.random()*bs.length)],c=CAT[b.type],x0=b.c*CELL,y0=b.r*CELL,W=c.w*CELL,H=c.h*CELL;
    if(INSIDE.includes(b.type)){n.tx=x0+W/2;n.ty=y0+H-2}
    else if(b.type==='gate'){n.tx=x0+(Math.random()<.5?14:W-14);n.ty=y0+H-2}
    else if(b.type==='guardhouse'){n.tx=x0+W/2+16;n.ty=y0+H+4}
    else if(b.type==='recycle'){n.tx=x0+W/2+(Math.random()*40-20);n.ty=y0+H+6}
    else if(['court','sandbox','playground','track'].includes(b.type)){n.tx=x0+22+Math.random()*(W-44);n.ty=y0+34+Math.random()*(H-44)}
    else{n.tx=x0+W/2+(Math.random()<.5?-24:24);n.ty=y0+H-2}
    n.target=b;
  }else{n.target=null;n.tx=30+Math.random()*(COLS*CELL-60);n.ty=50+Math.random()*(ROWS*CELL-80)}
}
function setAct(n,icon,cls,ms,t){n.state='act';n.until=t+ms;n.el.querySelector('.ic').textContent=icon;if(cls){n.el.classList.add(cls);n.cls=cls}}
function clearAct(n){n.el.querySelector('.ic').textContent='';if(n.cls){n.el.classList.remove(n.cls);n.cls=null}}
function go(n){clearAct(n);if(goesIn(n,phaseNow)&&sendToClass(n,npcs.indexOf(n)))return;pickTarget(n);n.state='walk'}
/* school day: class / lunch / free */
let forcePhase=null,phaseNow='free',classInit=false,lastCheck=0;
const mins=d=>d.getHours()*60+d.getMinutes();
const inR=(m,p)=>m>=p[0]*60+p[1]&&m<p[2]*60+p[3];
function periodNow(){const m=mins(new Date());return S.schedule.periods.find(p=>m>=toMin(p[0])&&m<toMin(p[1]))}
function clockPhase(){const m=mins(new Date()),L=S.schedule.lunch;return periodNow()?'class':(m>=toMin(L[0])&&m<toMin(L[1]))?'lunch':'free'}
const curPhase=()=>forcePhase||clockPhase();
const goesIn=(n,ph)=>ph==='class'?['ft','mt','g','b'].includes(n.p.role):ph==='lunch'?['g','b'].includes(n.p.role):false;
const classrooms=()=>S.campus.buildings.filter(b=>b.type==='classroom');
function sendToClass(n,i){const cr=classrooms();if(!cr.length)return false;const b=cr[Math.max(0,i)%cr.length];clearAct(n);n.el.style.opacity=1;n.target=b;n.tx=b.c*CELL+CELL+(Math.random()*16-8);n.ty=(b.r+2)*CELL-2;n.state='toClass';return true}
let AC=null;
document.addEventListener('pointerdown',()=>{try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}},{passive:true});
function chime(){if(!AC)return;try{const notes=[659.25,523.25,587.33,392,392,587.33,659.25,523.25];let t=AC.currentTime+.05;notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.28,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+1.3);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+1.4);t+=i===3?.9:.55})}catch(e){}}
function phaseCheck(t){
  const raw=curPhase(),ph=classrooms().length?raw:'free';
  if(ph===phaseNow&&classInit)return;
  const first=!classInit;classInit=true;phaseNow=ph;
  mapEl.classList.toggle('inclass',ph==='class');mapEl.classList.toggle('lunch',ph==='lunch');
  if(!first){const bell=hasB('clocktower');if(bell)chime();toast(ph==='class'?(bell?'噹噹噹～上課了！':'上課了！'):ph==='lunch'?'午休時間，同學回教室吃飯、睡午覺':(bell?'噹噹噹～下課囉！':'下課囉！'))}
  npcs.forEach((n,i)=>{const inside=n.state==='class'||n.state==='toClass';if(goesIn(n,ph)){if(!inside)sendToClass(n,i)}else if(inside){n.el.style.opacity=1;clearAct(n);n.state='act';n.until=t+i*150}});
  renderCbar();
}
function arrive(n,t){
  const b=n.target;
  if(!b){if(n.p.role==='clean')setAct(n,'🧹','dig',2600,t);else setAct(n,n.p.role==='pr'?'👋':'',null,700+Math.random()*1400,t);return}
  if(n.p.role==='clean'&&b.type!=='recycle'&&Math.random()<.6){setAct(n,'🧹','dig',2600,t);return}
  if(n.p.role==='pr'&&Math.random()<.5){setAct(n,'👋',null,1800,t);return}
  switch(b.type){
    case 'guardhouse':setAct(n,'👮',null,3500,t);break;
    case 'recycle':setAct(n,'♻️','dig',3200,t);break;
    case 'gate':setAct(n,'👋',null,3000,t);break;
    case 'classroom':case 'library':case 'office':case 'principal':case 'sportscenter':case 'health':case 'auditorium':n.state='inside';n.el.style.opacity=0;n.until=t+2500+Math.random()*3500;break;
    case 'court':setAct(n,'🏀','bounce',3200,t);break;
    case 'sandbox':setAct(n,'🏰','dig',3600,t);break;
    case 'playground':setAct(n,'🎈','jump',3000,t);break;
    case 'track':{const c=CAT.track,W=c.w*CELL,H=c.h*CELL;n.cx=b.c*CELL+W/2;n.cy=b.r*CELL+H/2+6;n.rx=W/2-20;n.ry=H/2-22;n.ang=Math.atan2((n.y-n.cy)/n.ry,(n.x-n.cx)/n.rx);n.state='run';n.until=t+4500+Math.random()*2500;n.el.querySelector('.ic').textContent='💨';break}
    default:setAct(n,b.type==='clocktower'?'🕐':b.type==='tree'?'🍃':b.type==='flower'?'🌼':'🐞',null,2400,t);
  }
}
function step(n,dt,t){
  if(n.state==='toClass'){const dx=n.tx-n.x,dy=n.ty-n.y,d=Math.hypot(dx,dy);if(d<2){n.state='class';n.el.style.opacity=0}else{const v=Math.min(d,n.speed*1.3*dt);n.x+=dx/d*v;n.y+=dy/d*v;if(Math.abs(dx)>1)n.flip=dx<0}}
  else if(n.state==='class'){}
  else if(n.state==='walk'){const dx=n.tx-n.x,dy=n.ty-n.y,d=Math.hypot(dx,dy);if(d<2)arrive(n,t);else{const v=Math.min(d,n.speed*dt);n.x+=dx/d*v;n.y+=dy/d*v;if(Math.abs(dx)>1)n.flip=dx<0}}
  else if(n.state==='run'){n.ang+=dt*1.5;const nx=n.cx+n.rx*Math.cos(n.ang),ny=n.cy+n.ry*Math.sin(n.ang);n.flip=nx<n.x;n.x=nx;n.y=ny;if(t>n.until)go(n)}
  else if(n.state==='inside'){if(t>n.until){n.el.style.opacity=1;if(n.target&&EXIT_ICON[n.target.type])setAct(n,EXIT_ICON[n.target.type],null,1600,t);else go(n)}}
  else if(t>n.until)go(n);
  draw(n);
}
function draw(n){n.el.style.transform=`translate(${(n.x-n.hw).toFixed(1)}px,${(n.y-n.hh).toFixed(1)}px)`;n.el.style.zIndex=n.say?6000:Math.round(n.y)+8;n.el.classList.toggle('flip',!!n.flip);n.el.classList.toggle('walk',n.state==='walk'||n.state==='run'||n.state==='toClass')}
let last=performance.now();
function tick(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(t-lastCheck>1000){lastCheck=t;phaseCheck(t)}if(view==='campus')for(const n of npcs)step(n,dt,t);requestAnimationFrame(tick)}
requestAnimationFrame(tick);
function speak(n){
  const lines=n.p.role==='nurse'?NU:n.p.role==='clean'?CL:n.p.role==='gd'?GD:n.p.role==='pr'?PR:(n.p.role==='ft'||n.p.role==='mt')?TE:ST.concat(actH().map(h=>`我今天也有${h.title}喔！`));
  let b=n.el.querySelector('.say');if(!b){b=document.createElement('div');b.className='say';n.el.appendChild(b)}
  b.textContent=lines[Math.floor(Math.random()*lines.length)];n.say=true;clearTimeout(n.sayT);
  if(n.state==='walk'||n.state==='act'){clearAct(n);n.state='act';n.until=performance.now()+2600}
  n.sayT=setTimeout(()=>{b.remove();n.say=false},2600);
}

/* effects */
function centerOf(el){return {x:el.offsetLeft+el.offsetWidth/2,y:el.offsetTop+el.offsetHeight/2}}
function confetti(x,y){const c=['#ff7a59','#ffd23f','#3d9bf0','#7cc65a','#ff7eb6','#b388ff'];for(let i=0;i<28;i++){const d=document.createElement('div');d.className='conf';d.style.left=x+'px';d.style.top=(y-30)+'px';d.style.background=c[i%c.length];d.style.setProperty('--dx',(Math.random()*220-110)+'px');d.style.setProperty('--dy',(Math.random()*140-40)+'px');d.style.animationDelay=(Math.random()*.15)+'s';mapEl.appendChild(d);setTimeout(()=>d.remove(),1500)}}

  const iv=setInterval(()=>{const d=document.createElement('div');d.className='dust';d.style.left=(el.offsetLeft+Math.random()*el.offsetWidth)+'px';d.style.top=(el.offsetTop+el.offsetHeight-10)+'px';d.style.setProperty('--dx',(Math.random()*30-15)+'px');mapEl.appendChild(d);setTimeout(()=>d.remove(),850)},120);

function finish(el,msg){startHint();el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');setTimeout(()=>el.classList.remove('pop'),650);const p=centerOf(el);confetti(p.x,p.y);cheer(p.x,p.y);toast(msg);syncPeople(true);renderStars()}

/* placing / moving */
function valid(type,c,r,ignore){const s=CAT[type];if(c<0||r<0||c+s.w>COLS||r+s.h>ROWS)return false;return !S.campus.buildings.some(b=>{if(b.id===ignore)return false;const o=CAT[b.type];return c<b.c+o.w&&b.c<c+s.w&&r<b.r+o.h&&b.r<r+s.h})}
function findSpot(type){const mid=Math.floor((wrap.scrollLeft+wrap.clientWidth/2-32)/CELL);for(let d=0;d<COLS;d++)for(const c of [mid-d,mid+d])for(let r=0;r<ROWS;r++)if(valid(type,c,r))return {c,r};return null}
function startMode(m){
  closeSheet();
  if(m.kind==='place'){const sp=findSpot(m.type);if(!sp){toast('校園沒有空地了');return}m.c=sp.c;m.r=sp.r}
  mode=m;ghost=document.createElement('div');ghost.className='ghost';ghost.innerHTML=svgFor(m.type,m.level||1);mapEl.appendChild(ghost);mapEl.classList.add('gridon');

}
function updGhost(){
  const c=CAT[mode.type];place(ghost,mode.c,mode.r,c.w,c.h);ghost.style.zIndex=5500;
  const ok=valid(mode.type,mode.c,mode.r,mode.id);ghost.classList.toggle('bad',!ok);

  pb.textContent=mode.kind==='move'?'放在這裡':`蓋在這裡（★${c.cost[0]}）`;
  $('#pbtxt').textContent=ok?'點地圖換位置':'這裡放不下，換個地方';
}
function endMode(){if(ghost)ghost.remove();ghost=null;mapEl.classList.remove('gridon');$('#placebar').classList.remove('on');$('#fab').hidden=false;if(mode&&mode.kind==='move'){const el=bEl(mode.id);if(el)el.style.opacity=''}mode=null}
$('#pbcancel').onclick=endMode;
$('#pbok').onclick=()=>{

mapEl.addEventListener('click',e=>{

function weekOf(base){const dow=(base.getDay()+6)%7;return [...Array(7)].map((_,i)=>{const d=new Date(base);d.setHours(12,0,0,0);d.setDate(base.getDate()-dow+i);return d})}

function checkBonus(base,fromParent){
  if(!S.bonusStars)return;const days=weekOf(base),wk=dkey(days[0]);if(S.bonusGiven[wk])return;

}

function wDays(off){const now=new Date(),dow=(now.getDay()+6)%7,mon=new Date(now);mon.setDate(now.getDate()-dow+off*7);return [...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d})}
function wStats(days){const tk=dkey(new Date());return actH().map(h=>{let done=0,plan=0;const ts=[];days.forEach(d=>{const k=dkey(d);if(k>tk)return;if(h.days.includes(d.getDay()))plan++;const r=(S.checkins[k]||{})[h.id];if(r){done++;if(r.by!=='parent'){const t=new Date(r.at);ts.push(t.getHours()*60+t.getMinutes())}}});return {h,done,plan,rate:plan?done/plan:0,avg:ts.length?Math.round(ts.reduce((a,b)=>a+b)/ts.length):null}})}

let resetArm2=false;
function pAction(t){
  const a=t.dataset.pa;

  else if(a==='check'||a==='uncheck'){const k=dkey(pDate),rec=S.checkins[k]||(S.checkins[k]={}),hb=S.habits.find(h=>h.id===t.dataset.h);
    if(a==='check'){rec[hb.id]={at:new Date().toISOString(),by:'parent',backfilled:k!==dkey(new Date())};S.stars++;logStar(1,`家長補打：${hb.title}（${fmtD(pDate)}）`)}
    else{delete rec[hb.id];S.stars=Math.max(0,S.stars-1);logStar(-1,`家長取消：${hb.title}（${fmtD(pDate)}）`)}
    save();if(a==='check')checkBonus(pDate,true);pToday()}
  else if(a==='approve'||a==='decline'){const x=S.redemptions.find(r=>r.id===t.dataset.id);x.status=a==='approve'?'approved':'declined';x.at=new Date().toISOString();if(a==='approve'){S.stars=Math.max(0,S.stars-x.cost);logStar(-x.cost,'兌換：'+x.title)}save();toast(a==='approve'?`已確認：${x.title}`:'已婉拒這次兌換');pToday()}

  else if(a==='mon'){pMonth=new Date(pMonth.getFullYear(),pMonth.getMonth()+Number(t.dataset.d),1);pHist()}

  else if(a==='rgp'){setPreset(t.dataset.v);pRange()}
  else if(a==='wk'){pWeek=Math.min(0,pWeek+Number(t.dataset.d));pReview()}
  else if(a==='sub'){pSub=t.dataset.s||null;resetArm2=false;pSet()}

  else if(a==='hslot'){hDraft.slot=t.dataset.v;setChip(t)}

  else if(a==='hdel'){if(t.dataset.sure){S.habits=S.habits.filter(h=>h.id!==hDraft.id);save();closeSheet();pSet();toast('已刪除');return}t.dataset.sure='1';t.textContent='確定刪除？（打卡紀錄也會看不到）'}

  else if(a==='rsave'){const title=$('#rT').value.trim(),cost=Math.max(1,Math.round(Number($('#rC').value)||0));if(!title){toast('請輸入獎勵名稱');return}const r=S.rewards.find(x=>x.id===t.dataset.id);if(r){r.title=title;r.cost=cost}else S.rewards.push({id:'r'+Date.now(),title,cost});save();closeSheet();pSet();toast('已儲存')}

  else if(a==='star'){const n=Math.max(1,Math.round(Number($('#sN').value)||0))*Number(t.dataset.d),why=$('#sR').value.trim()||(n>0?'家長加星星':'家長減星星');S.stars=Math.max(0,S.stars+n);logStar(n,why);save();renderStars();toast(`${n>0?'加了':'減了'} ${Math.abs(n)} 顆星星`);pSet()}

  else if(a==='padd'){const P=S.schedule.periods,last=P.length?P[P.length-1][1]:'08:00',m=toMin(last)+10,st=`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`,e=m+40;P.push([st,`${pad(Math.floor(e/60)%24)}:${pad(e%60)}`]);save();pSet()}

  else if(a==='cpin'){const p1=$('#pin1').value,p2=$('#pin2').value;if(!/^\d{4}$/.test(p1)){toast('密碼要是 4 位數字');return}if(p1!==p2){toast('兩次輸入不一樣');return}S.pin=p1;save();$('#pin1').value=$('#pin2').value='';toast('密碼已更改')}
  else if(a==='maxp'){S.maxPpl=Number($('#maxP').value);save();toast('已儲存，回到孩子畫面就會更新')}
  else if(a==='t10'){S.stars+=10;save();renderStars();toast('測試用：多了 10 顆星星')}
  else if(a==='phase'){forcePhase=t.dataset.v||null;phaseCheck(performance.now());pSet()}
  else if(a==='reset1'){if(!resetArm2){resetArm2=true;t.textContent='再按一次，確定清除';return}
    S=ensure(seed(false));save();npcs.splice(0).forEach(n=>n.el.remove());staffN={};classInit=false;phaseNow='free';forcePhase=null;renderCampus();renderAll();pSub=null;pSet();toast('資料已清除，新的校園準備好了')}
}
document.querySelector('.pshell').addEventListener('click',e=>{const t=e.target.closest('[data-pa]');if(t)pAction(t)});
$('#sheet').addEventListener('click',e=>{const t=e.target.closest('[data-pa]');if(t)pAction(t)});
$('#p-set').addEventListener('change',e=>{const t=e.target;

/* ================= cloud (Firebase) ================= */
const FB_CONFIG={apiKey:"AIzaSyAaOBrK6VXLPNevtGyPu0fJM057VXTlQ18",authDomain:"star-school-12551.firebaseapp.com",projectId:"star-school-12551",storageBucket:"star-school-12551.firebasestorage.app",messagingSenderId:"119736379889",appId:"1:119736379889:web:e7fe0b784d4fbbcee7fc50"};
const FB_VER='10.12.2',DEV_KEY='starSchool.device';
function devGet(){try{return JSON.parse(localStorage.getItem(DEV_KEY))||null}catch(e){return null}}
function devSet(v){try{v?localStorage.setItem(DEV_KEY,JSON.stringify(v)):localStorage.removeItem(DEV_KEY)}catch(e){}}
function showOnb(sc){$('#onb').classList.add('on');$('#onb').querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x.dataset.s===sc));onbMsg('')}
function hideOnb(){$('#onb').classList.remove('on')}
function onbMsg(m){$('#onbMsg').textContent=m||''}
/* cloud document shape */
function toCloud(st){const b={};st.campus.buildings.forEach(x=>{b[x.id]=x});const rd={};st.redemptions.forEach(x=>{rd[x.id]=x});
  return {v:1,stars:st.stars,habits:st.habits,checkins:st.checkins,campus:{b},rewards:st.rewards,redemptions:rd,child:st.child,pin:st.pin,notes:st.notes,reviews:st.reviews,
    schedule:{periods:st.schedule.periods.map(p=>({s:p[0],e:p[1]})),lunch:st.schedule.lunch},maxPpl:st.maxPpl,bonusStars:st.bonusStars,bonusGiven:st.bonusGiven}}
function fromCloud(d){return {v:1,stars:d.stars||0,habits:d.habits||[],checkins:d.checkins||{},
  campus:{nextId:0,buildings:Object.values((d.campus&&d.campus.b)||{}).sort((x,y)=>(x.t||0)-(y.t||0))},
  rewards:d.rewards||[],redemptions:Object.values(d.redemptions||{}).sort((x,y)=>x.at>y.at?1:-1),child:d.child,pin:d.pin,notes:d.notes||{},reviews:d.reviews||{},
  schedule:d.schedule?{periods:(d.schedule.periods||[]).map(p=>[p.s,p.e]),lunch:d.schedule.lunch||DEF_SCHED.lunch.slice()}:undefined,
  maxPpl:d.maxPpl,bonusStars:d.bonusStars,bonusGiven:d.bonusGiven||{},starLog:[],demo:false}}
const DEPTH={checkins:2,campus:2,redemptions:1,notes:1,reviews:1,bonusGiven:1};
function flat(o){const out={};for(const k in o){if(k==='stars')continue;walk(o[k],k,DEPTH[k]||0,out)}return out}
function walk(v,p,d,out){if(d>0&&v&&typeof v==='object'&&!Array.isArray(v)){for(const k in v)walk(v[k],p+'.'+k,d-1,out)}else{const c=JSON.parse(JSON.stringify(v===undefined?null:v));out[p]={v:c,s:JSON.stringify(c)}}}
function setBase(){const cur=flat(toCloud(S));base={};for(const k in cur)base[k]=cur[k].s;baseStars=S.stars}
function syncPush(){
  const cur=flat(toCloud(S)),up={};
  for(const k in cur)if(base[k]!==cur[k].s)up[k]=cur[k].v;
  for(const k in base)if(!(k in cur))up[k]=F.deleteField();
  const dS=S.stars-baseStars;if(dS)up.stars=F.increment(dS);
  if(!Object.keys(up).length)return;
  base={};for(const k in cur)base[k]=cur[k].s;baseStars=S.stars;
  F.updateDoc(CLOUD.ref,up).catch(e=>{console.error(e);toast('同步失敗：'+(e.code||e.message))});
}
function applyRemote(d){
  const prevCampus=JSON.stringify(S.campus.buildings),log=S.starLog;
  S=ensure(fromCloud(d));S.starLog=log;setBase();
  renderStars();
  if(JSON.stringify(S.campus.buildings)!==prevCampus&&!mode){mapEl.querySelectorAll('.bld').forEach(x=>x.remove());S.campus.buildings.forEach(b=>mapEl.appendChild(bldEl(b)));syncPeople(false);startHint()}
  const ae=document.activeElement,typing=ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName);
  if(document.body.classList.contains('pmode')){if(!typing&&!$('#sheet').classList.contains('on'))pRender()}
  else{if(view==='today')renderToday();else if(view==='week')renderWeek();else if(view==='rewards')renderRewards();renderCbar()}
}
function subscribe(fid){
  CLOUD.fid=fid;CLOUD.ref=F.doc(CLOUD.db,'families',fid);showOnb('loading');
  if(CLOUD.unsub)CLOUD.unsub();if(CLOUD.unsubLog)CLOUD.unsubLog();
  CLOUD.unsub=F.onSnapshot(CLOUD.ref,snap=>{
    if(!snap.exists()){leaveFamily('找不到這個家庭');return}
    const d=snap.data(),me=d.members&&d.members[CLOUD.user.uid];
    if(!me){leaveFamily('這台裝置已經被移出家庭');return}
    CLOUD.role=me.role;CLOUD.fam={inviteCode:d.inviteCode,members:d.members||{}};
    if(!CLOUD.ready){
      S=ensure(fromCloud(d));setBase();CLOUD.ready=true;CLOUD.busy=false;hideOnb();
      npcs.splice(0).forEach(n=>n.el.remove());staffN={};classInit=false;phaseNow='free';
      renderCampus();renderAll();show('today');
      if(me.role==='parent')enterParent();else document.body.classList.remove('pmode');
    }else applyRemote(d);
  },err=>{console.error(err);if(err.code==='permission-denied')leaveFamily('沒有權限讀取這個家庭');else toast('連線問題：'+err.code)});
  CLOUD.unsubLog=F.onSnapshot(F.query(F.collection(CLOUD.ref,'logs'),F.orderBy('at','desc'),F.limit(50)),q=>{S.starLog=q.docs.map(x=>x.data()).reverse();if(document.body.classList.contains('pmode')&&pTab==='p-hist')pHist()},e=>console.warn(e));
}
function leaveFamily(msg){if(CLOUD.unsub)CLOUD.unsub();if(CLOUD.unsubLog)CLOUD.unsubLog();CLOUD.ready=false;devSet(null);document.body.classList.remove('pmode');showOnb('start');onbMsg(msg)}
const CODE_CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const genCode=()=>Array.from({length:6},()=>CODE_CH[Math.floor(Math.random()*CODE_CH.length)]).join('');
async function freeCode(){for(let i=0;i<6;i++){const c=genCode();const ex=await F.getDoc(F.doc(CLOUD.db,'invites',c));if(!ex.exists())return c}throw new Error('code')}
async function joinWithCode(raw,role){
  const code=String(raw||'').trim().toUpperCase();
  if(!/^[A-Z0-9]{6}$/.test(code)){onbMsg('邀請碼是 6 個英文字母或數字');return}
  CLOUD.busy=true;onbMsg('');$('#onbMsg').textContent='加入中…';
  try{
    if(role==='child'&&!CLOUD.auth.currentUser)await F.signInAnonymously(CLOUD.auth);
    const u=CLOUD.auth.currentUser;
    const inv=await F.getDoc(F.doc(CLOUD.db,'invites',code));
    if(!inv.exists()){CLOUD.busy=false;onbMsg('找不到這個邀請碼，請再確認一次');return}
    const fid=inv.data().fid;
    await F.updateDoc(F.doc(CLOUD.db,'families',fid),{['members.'+u.uid]:{role,name:role==='child'?'孩子的手機':(u.displayName||'家長'),code,at:new Date().toISOString()}});
    devSet({fid,uid:u.uid});subscribe(fid);
  }catch(e){console.error(e);CLOUD.busy=false;onbMsg(e.code==='permission-denied'?'邀請碼不對或已經換新的了':'加入失敗：'+(e.code||e.message))}
}
async function createFamily(){
  CLOUD.busy=true;$('#onbMsg').textContent='建立中…';
  try{
    const u=CLOUD.auth.currentUser,code=await freeCode(),ref=F.doc(F.collection(CLOUD.db,'families')),st=ensure(seed(false));
    await F.setDoc(ref,{...toCloud(st),inviteCode:code,members:{[u.uid]:{role:'parent',name:u.displayName||'家長',code,at:new Date().toISOString()}},createdAt:F.serverTimestamp()});
    await F.setDoc(F.doc(CLOUD.db,'invites',code),{fid:ref.id});
    devSet({fid:ref.id,uid:u.uid});subscribe(ref.id);
  }catch(e){console.error(e);CLOUD.busy=false;onbMsg('建立失敗：'+(e.code||e.message))}
}
async function newInvite(){
  try{const old=CLOUD.fam.inviteCode,code=await freeCode();
    await F.setDoc(F.doc(CLOUD.db,'invites',code),{fid:CLOUD.fid});
    await F.updateDoc(CLOUD.ref,{inviteCode:code});
    if(old)await F.deleteDoc(F.doc(CLOUD.db,'invites',old)).catch(()=>{});
    toast('已換成新的邀請碼：'+code);
  }catch(e){console.error(e);toast('換邀請碼失敗：'+(e.code||e.message))}
}
async function googleIn(){
  const p=new F.GoogleAuthProvider();CLOUD.busy=true;onbMsg('');
  try{if(CLOUD.auth.currentUser&&CLOUD.auth.currentUser.isAnonymous)await F.signOut(CLOUD.auth);await F.signInWithPopup(CLOUD.auth,p);parentChoose()}
  catch(e){console.error(e);if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){await F.signInWithRedirect(CLOUD.auth,p)}else{CLOUD.busy=false;onbMsg(e.code==='auth/popup-closed-by-user'?'登入視窗被關掉了，再試一次':'登入失敗：'+(e.code||e.message))}}
}
function parentChoose(){const u=CLOUD.auth.currentUser;showOnb('pchoose');$('#pHello').textContent=`已用 ${u.email||u.displayName||'Google 帳號'} 登入`;CLOUD.busy=false}
$('#onb').addEventListener('click',e=>{const t=e.target.closest('[data-o]');if(!t)return;const o=t.dataset.o;
  if(o==='kid')showOnb('kid');
  else if(o==='parent'){const u=CLOUD.auth.currentUser;if(u&&!u.isAnonymous)parentChoose();else showOnb('parent')}
  else if(o==='back')showOnb('start');
  else if(o==='local'){devSet({local:true});hideOnb()}
  else if(o==='kidJoin')joinWithCode($('#kidCode').value,'child');
  else if(o==='parJoin')joinWithCode($('#parCode').value,'parent');
  else if(o==='google')googleIn();
  else if(o==='create')createFamily();
  else if(o==='logout'){F.signOut(CLOUD.auth).then(()=>showOnb('parent'))}
  else if(o==='retry')location.reload();
});
async function cloudInit(){
  const dev=devGet();
  if(dev&&dev.local)return;
  const B=`https://www.gstatic.com/firebasejs/${FB_VER}/`;
  try{showOnb('loading');const r=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);F=Object.assign({},r[0],r[1],r[2])}
  catch(e){if(dev&&dev.fid)showOnb('offline');else hideOnb();return}
  const app=F.initializeApp(FB_CONFIG);
  let db;try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){db=F.getFirestore(app)}
  CLOUD={db,auth:F.getAuth(app),ready:false,busy:false};
  F.onAuthStateChanged(CLOUD.auth,u=>{CLOUD.user=u;if(CLOUD.ready||CLOUD.busy)return;const d=devGet();
    if(u&&d&&d.fid&&d.uid===u.uid)subscribe(d.fid);
    else if(u&&!u.isAnonymous)parentChoose();
    else showOnb('start')});
}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
cloudInit();
}
